# Full stack: PostgreSQL + I-ITSM (API + web UI) on http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: itsm
      DB_USER: itsm
      DB_PASSWORD: itsm
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-of-at-least-32-bytes}
      SLA_TIME_SCALE: ${SLA_TIME_SCALE:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    restart: unless-stopped

volumes:
  pgdata:
